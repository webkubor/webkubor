name: Sync profile

# 主页的 star 数、项目数、最近推送时间由 CI 每天自动同步，
# 不用人肉改 README。CI 只写 data/recent.json 并重新生成双语 README，
# 产物一致性由 scripts/check-readme.mjs 门禁把住。

on:
  schedule:
    - cron: '17 5 * * *'   # 每天 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/sync-profile.yml'

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub 元数据一律走 gh CLI（不手写 HTTP 请求）
      - name: Pull latest repo stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-data.mjs

      - name: Rebuild bilingual README
        run: node scripts/build-readme.mjs

      - name: Verify profile assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-profile.mjs
          node scripts/check-profile.mjs
          node scripts/check-readme.mjs

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recent.json README.md README.en.md
          if git diff --cached --quiet; then
            echo '没有变化，跳过提交'
            exit 0
          fi
          git commit -m 'chore(profile): 同步项目数据与双语主页

          Agent: github-actions[bot]'
          git push
