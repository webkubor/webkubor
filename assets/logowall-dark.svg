<desc id="d">Bloom、Scorecard、reel-kit、chat-mood-gen、Meridian、壁纸编辑器，共 6 个项目的透明底 logo。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.nm{font-size:18px;font-weight:500;fill:#dcccd3}.h1{font-size:30px;font-weight:600;fill:#fef6f9}.sub{font-size:19px;fill:#dcccd3}.cell{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
