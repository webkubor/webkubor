ranslateX(0px) scale(1)}}.c1{animation:c1 9s cubic-bezier(.2,.8,.2,1) infinite both}.k1{animation:k1 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c2{0%,14%{fill:#92a8b3}30%,88%{fill:#92a8b3}100%{fill:#92a8b3}}@keyframes k2{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.22)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c2{animation:c2 9s cubic-bezier(.2,.8,.2,1) infinite both}.k2{animation:k2 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c3{0%,14%{fill:#a073d7}30%,88%{fill:#a779de}100%{fill:#a073d7}}@keyframes k3{0%,14%{transform:translateX(-7.1px)}30%{transform:translateX(5px)}38%{transform:translateX(1.8px)}44%,88%{transform:translateX(0px)}100%{transform:translateX(-7.1px)}}.c3{animation:c3 9s cubic-bezier(.2,.8,.2,1) infinite both}.k3{animation:k3 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c4{0%,14%{fill:#5fa8b2}30%,88%{fill:#5fa8b2}100%{fill:#5fa8b2}}@keyframes k4{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.22)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c4{animation:c4 9s cubic-bezier(.2,.8,.2,1) infinite both}.k4{animation:k4 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c5{0%,14%{fill:#b4a09b}30%,88%{fill:#b4a09b}100%{fill:#b4a09b}}@keyframes k5{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.22)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c5{animation:c5 9s cubic-bezier(.2,.8,.2,1) infinite both}.k5{animation:k5 9s cubic-bezier(.2,.8,.2,1) infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
