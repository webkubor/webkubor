<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">webkubor：把审美做成可验证的工程</title>
<desc id="d">六片 Bloom 莫兰迪花瓣在量环中展开；字标先以原色写出（对比度 8.2:1），再沉为墨色（13.8:1），标尺标出 WCAG AA 与 AAA 门槛。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.small{font-size:13px;fill:#dcccd3}.word{font-size:88px;font-weight:600;letter-spacing:-2px;fill:#fef6f9}.ink{animation:ink 1.4s ease-out both}.pt{opacity:.78;mix-blend-mode:normal;transform-box:fill-box;transform-origin:50% 100%;animation:unfurl 1.3s cubic-bezier(.2,.8,.2,1) both}.bloom{transform-origin:212px 170px;animation:spin 140s linear 1.6s infinite}.ring{transform-origin:212px 170px;animation:spin 90s linear infinite reverse}.halo{transform-box:fill-box;transform-origin:center;animation:breathe 4.8s ease-in-out 1.6s infinite}.rule{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.2,.8,.2,1) 1.1s both}.ticks{animation:fade .6s ease-out 1.8s both}.mark{animation:slide 1.5s cubic-bezier(.2,.8,.2,1) 2.1s both}.lb-raw{opacity:0;animation:raw 2.4s linear 1.5s both}.lb-ink{animation:fade .5s ease-out 3.5s both}.tag{animation:fade .9s ease-out 2.6s both}.tag2{animation:fade .9s ease-out 3s both}@keyframes unfurl{from{opacity:0;transform:scale(.12) rotate(-28deg)}to{opacity:.78;transform:none}}@keyframes ink{0%{fill:#ffaac8;opacity:0}15%{fill:#ffaac8;opacity:1}55%{fill:#ffaac8}100%{fill:#fef6f9}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.25}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(-194.2px);opacity:0}12%{transform:translateX(-194.2px);opacity:1}to{transform:none}}@keyframes raw{0%,25%{opacity:0}35%,70%{opacity:1}85%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
