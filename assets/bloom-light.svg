<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Bloom 色板：同一色相，只解亮度</title>
<desc id="d">六个 Bloom 莫兰迪原色在浅色底上的对比度：Petal 2.3:1 解为 4.5:1，Sage 2.8:1 解为 4.5:1，Mist 2.3:1 解为 4.5:1，Spring 3.3:1 解为 4.5:1，Ripple 2.5:1 解为 4.5:1，Stone 2.3:1 解为 4.5:1。共 6 个需要调整亮度。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.h1{font-size:21px;font-weight:600;fill:#2a1e22}.sub{font-size:15px;fill:#5f5156}.nm{font-size:15px;font-weight:600;fill:#2a1e22}.aa{font-size:34px;font-weight:600}.lb{font-size:14px;fill:#5f5156}.hx{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace;font-size:13px;fill:#5f5156}.raw{opacity:0}.cyc .raw{animation:out 10s ease-in-out infinite both}.cyc .fix{animation:in 10s ease-in-out infinite both}@keyframes out{0%,22%{opacity:1}30%,90%{opacity:0}97%,100%{opacity:1}}@keyframes in{0%,26%{opacity:0}34%,86%{opacity:1}94%,100%{opacity:0}}@keyframes s0{0%,22%{fill:#e8859b}96%,100%{fill:#e8859b}34%,86%{fill:#b2546b}}@keyframes k0{0%,22%{transform:translateX(53.8px);fill:#e8859b}96%,100%{transform:translateX(53.8px);fill:#e8859b}34%,86%{transform:none;fill:#b2546b}}.s0{animation:s0 10s ease-in-out infinite both}.k0{animation:k0 10s ease-in-out infinite both}.c0 .raw,.c0 .fix{animation-delay:0.0s}@keyframes s1{0%,22%{fill:#8a9a5b}96%,100%{fill:#8a9a5b}34%,86%{fill:#6a783a}}@keyframes k1{0%,22%{transform:translateX(37.3px);fill:#8a9a5b}96%,100%{transform:translateX(37.3px);fill:#8a9a5b}34%,86%{transform:none;fill:#6a783a}}.s1{animation:s1 10s ease-in-out infinite both}.k1{animation:k1 10s ease-in-out infinite both}.c1 .raw,.c1 .fix{animation-delay:0.3s}@keyframes s2{0%,22%{fill:#92a8b3}96%,100%{fill:#92a8b3}34%,86%{fill:#617580}}@keyframes k2{0%,22%{transform:translateX(56.2px);fill:#92a8b3}96%,100%{transform:translateX(56.2px);fill:#92a8b3}34%,86%{transform:none;fill:#617580}}.s2{animation:s2 10s ease-in-out infinite both}.k2{animation:k2 10s ease-in-out infinite both}.c2 .raw,.c2 .fix{animation-delay:0.6s}@keyframes s3{0%,22%{fill:#a073d7}96%,100%{fill:#a073d7}34%,86%{fill:#8a5dbe}}@keyframes k3{0%,22%{transform:translateX(24.8px);fill:#a073d7}96%,100%{transform:translateX(24.8px);fill:#a073d7}34%,86%{transform:none;fill:#8a5dbe}}.s3{animation:s3 10s ease-in-out infinite both}.k3{animation:k3 10s ease-in-out infinite both}.c3 .raw,.c3 .fix{animation-delay:0.9s}@keyframes s4{0%,22%{fill:#5fa8b2}96%,100%{fill:#5fa8b2}34%,86%{fill:#317c86}}@keyframes k4{0%,22%{transform:translateX(47.8px);fill:#5fa8b2}96%,100%{transform:translateX(47.8px);fill:#5fa8b2}34%,86%{transform:none;fill:#317c86}}.s4{animation:s4 10s ease-in-out infinite both}.k4{animation:k4 10s ease-in-out infinite both}.c4 .raw,.c4 .fix{animation-delay:1.2s}@keyframes s5{0%,22%{fill:#b4a09b}96%,100%{fill:#b4a09b}34%,86%{fill:#816e6a}}@keyframes k5{0%,22%{transform:translateX(55.6px);fill:#b4a09b}96%,100%{transform:translateX(55.6px);fill:#b4a09b}34%,86%{transform:none;fill:#816e6a}}.s5{animation:s5 10s ease-in-out infinite both}.k5{animation:k5 10s ease-in-out infinite both}.c5 .raw,.c5 .fix{animation-delay:1.5s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="400" rx="24" fill="#fef6f9"/>
<rect x=".5" y=".5" width="1199" height="399" rx="23.5" fill="none" stroke="#e9d9e0"/>
<text class="h1" x="56" y="58">原色铺气氛，文字只解亮度</text>
<text class="sub" x="56" y="86">莫兰迪原色直接当文字先量一次；不到 4.5:1 的，色相和彩度不动，只把亮度解到刚好达标。</text>

