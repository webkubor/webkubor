  <circle class="k0" cx="56.7" cy="290" r="6" fill="#b2546b" stroke="#fef6f9" stroke-width="2" style="animation-delay:0.0s"/>
  <g transform="translate(0 328)" class="cyc c0"><text class="lb raw" y="0">原色当字 2.3:1</text>
<text class="lb fix" y="0">解出 4.5:1 <tspan fill="#667436">✓</tspan></text>
<text class="hx raw" y="24">#e8859b</text>
<text class="hx fix" y="24">#b2546b</text></g>
</g>
